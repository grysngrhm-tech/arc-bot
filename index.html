<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Architectural Review Console | Discovery West</title>
  
  <!-- PWA Meta Tags -->
  <meta name="description" content="Discovery West architectural guidelines assistant. Get instant answers about CC&Rs, design guidelines, and community rules with citations from official documents.">
  <meta name="theme-color" content="#c96f3c">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARC Bot">
  <meta name="format-detection" content="telephone=no">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Favicons and App Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
  
  <!-- iOS Splash Screens (basic) -->
  <link rel="apple-touch-startup-image" href="assets/icons/icon-512.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS RESET & BASE ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ===== CSS VARIABLES - DISCOVERY WEST DARK THEME ===== */
    :root {
      --bg-primary: #2d2d2d;
      --bg-secondary: #3d3d3d;
      --bg-chat: #2d2d2d;
      --bg-card: #454545;
      --bg-input: #525252;
      --bg-user-msg: linear-gradient(135deg, #c96f3c 0%, #b85a2a 100%);
      --bg-bot-msg: #3d3d3d;
      --bg-source: #454545;
      --bg-source-expanded: #525252;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --text-muted: #888888;
      --text-on-accent: #ffffff;
      --accent: #c96f3c;
      --accent-hover: #d4844f;
      --accent-subtle: rgba(201, 111, 60, 0.15);
      --border: #555555;
      --border-focus: #c96f3c;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.4);
      --confidence-high: #4ade80;
      --confidence-medium: #fbbf24;
      --confidence-low: #f87171;
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-pill: 25px;
      --transition: 200ms ease;
    }

    /* ===== LIGHT THEME OVERRIDE ===== */
    [data-theme="light"] {
      --bg-primary: #f5f5f5;
      --bg-secondary: #ffffff;
      --bg-chat: #f5f5f5;
      --bg-card: #ffffff;
      --bg-input: #ffffff;
      --bg-user-msg: linear-gradient(135deg, #c96f3c 0%, #b85a2a 100%);
      --bg-bot-msg: #ffffff;
      --bg-source: #f0f0f0;
      --bg-source-expanded: #e5e5e5;
      --text-primary: #1a1a1a;
      --text-secondary: #4a4a4a;
      --text-muted: #777777;
      --text-on-accent: #ffffff;
      --accent: #c96f3c;
      --accent-hover: #b85a2a;
      --accent-subtle: rgba(201, 111, 60, 0.1);
      --border: #d5d5d5;
      --border-focus: #c96f3c;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
      --confidence-high: #16a34a;
      --confidence-medium: #ca8a04;
      --confidence-low: #dc2626;
    }

    /* ===== TYPOGRAPHY ===== */
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-primary);
      background: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== LAYOUT ===== */
    .app-container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg-secondary);
      box-shadow: var(--shadow-lg);
    }

    @media (min-width: 768px) {
      .app-container {
        margin: 1rem auto;
        height: calc(100vh - 2rem);
        border-radius: var(--radius-xl);
        overflow: hidden;
      }
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      cursor: pointer;
      border-radius: 8px;
      padding: 0.25rem 0.5rem;
      margin: -0.25rem -0.5rem;
      transition: background 0.2s ease;
    }
    
    .header-brand:hover {
      background: var(--bg-card);
    }
    
    .header-brand:active {
      background: var(--bg-input);
    }

    .header-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .header-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .header-titles {
      display: flex;
      flex-direction: column;
      gap: 0.125rem;
    }

    .header h1 {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .header-subtitle {
      font-size: 0.6875rem;
      color: var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0.5rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      color: var(--text-secondary);
    }

    .theme-toggle:hover svg {
      color: var(--accent);
    }

    /* Dark theme is default, so show moon by default */
    .theme-toggle .sun { display: block; }
    .theme-toggle .moon { display: none; }
    [data-theme="light"] .theme-toggle .sun { display: none; }
    [data-theme="light"] .theme-toggle .moon { display: block; }

    /* ===== CHAT AREA ===== */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--bg-chat);
    }

    /* ===== MESSAGES ===== */
    .message {
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-user {
      align-self: flex-end;
    }

    .message-bot {
      align-self: flex-start;
    }

    .message-content {
      padding: 0.875rem 1rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .message-user .message-content {
      background: var(--bg-user-msg);
      color: var(--text-on-accent);
      border-bottom-right-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
    }

    .message-bot .message-content {
      background: var(--bg-bot-msg);
      color: var(--text-primary);
      border-bottom-left-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .message-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .message-sender {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--accent);
    }

    /* ===== CONFIDENCE BADGE ===== */
    .confidence-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-sm);
      background: var(--bg-source);
    }

    .confidence-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .confidence-high .confidence-dot { background: var(--confidence-high); }
    .confidence-medium .confidence-dot { background: var(--confidence-medium); }
    .confidence-low .confidence-dot { background: var(--confidence-low); }

    .confidence-high { color: var(--confidence-high); }
    .confidence-medium { color: var(--confidence-medium); }
    .confidence-low { color: var(--confidence-low); }

    /* ===== CONFIDENCE BADGE - INTERACTIVE ===== */
    .confidence-badge {
      cursor: pointer;
      position: relative;
      transition: var(--transition);
    }

    .confidence-badge:hover {
      opacity: 0.8;
    }

    .confidence-tooltip {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 280px;
      padding: 0.75rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      font-size: 0.8125rem;
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.5;
      z-index: 100;
      display: none;
      animation: tooltipFadeIn 0.15s ease;
    }

    .confidence-tooltip::before {
      content: '';
      position: absolute;
      top: -6px;
      right: 16px;
      width: 10px;
      height: 10px;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      border-top: 1px solid var(--border);
      transform: rotate(45deg);
    }

    .confidence-badge.tooltip-open .confidence-tooltip {
      display: block;
    }

    @keyframes tooltipFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== MESSAGE HEADER ACTIONS ===== */
    .message-header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .message-header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .copy-btn {
      background: transparent;
      border: none;
      padding: 0.25rem;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .copy-btn:hover {
      color: var(--text-secondary);
      background: var(--bg-source);
    }

    .copy-btn svg {
      width: 14px;
      height: 14px;
    }

    .copy-btn.copied {
      color: var(--confidence-high);
    }

    /* ===== SPEAK BUTTON & WAVEFORM ===== */
    .speak-btn {
      background: transparent;
      border: none;
      padding: 0.25rem;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .speak-btn:hover {
      color: var(--text-secondary);
      background: var(--bg-source);
    }

    .speak-btn .speaker-icon {
      width: 14px;
      height: 14px;
    }

    .speak-btn .waveform {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 14px;
    }

    .speak-btn.speaking .speaker-icon {
      display: none;
    }

    .speak-btn.speaking .waveform {
      display: flex;
    }

    .speak-btn.speaking {
      color: var(--accent);
    }

    .waveform span {
      display: block;
      width: 2px;
      height: 4px;
      background: currentColor;
      border-radius: 1px;
      animation: waveform-bar 0.8s ease-in-out infinite;
    }

    .waveform span:nth-child(1) { animation-delay: 0s; }
    .waveform span:nth-child(2) { animation-delay: 0.1s; }
    .waveform span:nth-child(3) { animation-delay: 0.2s; }
    .waveform span:nth-child(4) { animation-delay: 0.3s; }
    .waveform span:nth-child(5) { animation-delay: 0.4s; }

    @keyframes waveform-bar {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }

    .speak-btn.loading {
      color: var(--accent);
      pointer-events: none;
    }
    
    .speak-btn.loading .speaker-icon {
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ===== ANSWER SECTION ===== */
    .answer-section {
      margin-bottom: 0.75rem;
    }

    .answer-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.375rem;
    }

    .answer-text {
      line-height: 1.7;
      color: var(--text-primary);
    }

    .answer-text p {
      margin-bottom: 0.5rem;
    }

    .answer-text p:last-child {
      margin-bottom: 0;
    }

    /* ===== SOURCES & REQUIREMENTS SECTION ===== */
    .sources-section {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .sources-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ===== SOURCE ITEM WITH REQUIREMENTS ===== */
    .source-item {
      background: var(--bg-source);
      border-radius: var(--radius-md);
      margin-bottom: 0.625rem;
      overflow: hidden;
      transition: all 0.2s ease;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
    }

    .source-item:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-sm);
    }

    .source-item:last-child {
      margin-bottom: 0;
    }

    .source-header {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.75rem;
    }

    .source-info {
      flex: 1;
      min-width: 0;
    }

    .source-path {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.125rem;
      line-height: 1.4;
    }

    .source-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* ===== AUTHORITY BADGE ===== */
    .authority-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.625rem;
      font-weight: 600;
      padding: 0.125rem 0.5rem;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .authority-binding {
      background: var(--accent-subtle);
      color: var(--accent);
    }

    .authority-guidance {
      background: rgba(136, 136, 136, 0.15);
      color: var(--text-muted);
    }

    /* ===== SOURCE REQUIREMENTS ===== */
    .source-requirements {
      padding: 0.5rem 0.75rem 0.75rem 1rem;
      border-left: 3px solid var(--accent);
      margin: 0 0.75rem 0.5rem 0.75rem;
      background: var(--accent-subtle);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    .requirements-label {
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .source-requirements ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .source-requirements li {
      position: relative;
      padding-left: 1rem;
      margin-bottom: 0.375rem;
      font-size: 0.8125rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .source-requirements li:last-child {
      margin-bottom: 0;
    }

    .source-requirements li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.5rem;
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
    }

    /* ===== VIEW SOURCE LINK ===== */
    .view-source-link {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.75rem;
      margin: 0 0.75rem 0.75rem 0.75rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.6875rem;
      font-family: inherit;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-weight: 500;
    }

    .view-source-link:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-subtle);
    }

    .view-source-link svg {
      width: 12px;
      height: 12px;
    }

    /* ===== SOURCE MODAL ===== */
    .source-modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      animation: fadeIn 0.15s ease;
    }

    .source-modal-overlay.active {
      display: flex;
    }

    .source-modal {
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      max-width: 700px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.2s ease;
    }

    .source-modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .source-modal-title {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .source-modal-close {
      background: none;
      border: none;
      padding: 0.25rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: var(--transition);
      flex-shrink: 0;
    }

    .source-modal-close:hover {
      color: var(--text-primary);
    }

    .source-modal-close svg {
      width: 20px;
      height: 20px;
    }

    .source-modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      font-size: 0.875rem;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideDown {
      from { opacity: 0; max-height: 0; }
      to { opacity: 1; max-height: 200px; }
    }

    /* ===== MESSAGE BODY ===== */
    .message-body {
      line-height: 1.7;
    }

    .message-body p {
      margin-bottom: 0.75rem;
    }

    .message-body p:last-child {
      margin-bottom: 0;
    }

    .message-body strong {
      font-weight: 600;
    }

    .message-body ul, .message-body ol {
      margin: 0.5rem 0 0.75rem 1.25rem;
    }

    .message-body li {
      margin-bottom: 0.25rem;
    }


    @keyframes slideDown {
      from { opacity: 0; max-height: 0; }
      to { opacity: 1; max-height: 200px; }
    }

    /* ===== WELCOME PANEL ===== */
    .welcome-panel {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      animation: welcomeFadeIn 0.5s ease;
    }

    @keyframes welcomeFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero Section */
    .welcome-hero {
      text-align: center;
      margin-bottom: 2rem;
      animation: welcomeFadeIn 0.5s ease;
    }

    .welcome-icon {
      width: 72px;
      height: 86px;
      margin: 0 auto 0.75rem;
    }

    .welcome-logo {
      width: 72px;
      height: 86px;
      object-fit: contain;
    }

    .welcome-hero h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    .welcome-tagline {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin: 0;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Two-Column Content */
    .welcome-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      animation: welcomeFadeIn 0.5s ease 0.15s both;
    }

    @media (max-width: 640px) {
      .welcome-content {
        grid-template-columns: 1fr;
      }
    }

    .welcome-knowledge,
    .welcome-getstarted {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
    }

    .welcome-knowledge h3,
    .welcome-getstarted h3 {
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .section-intro {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin: 0 0 1rem 0;
      line-height: 1.5;
    }

    .badge-inline {
      display: inline-block;
      font-size: 0.625rem;
      font-weight: 600;
      padding: 0.125rem 0.375rem;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-inline.binding {
      background: rgba(74, 222, 128, 0.15);
      color: var(--confidence-high);
    }

    /* ===== DOCUMENT LINKS ===== */
    .welcome-knowledge .document-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    @media (max-width: 480px) {
      .welcome-knowledge .document-links {
        grid-template-columns: 1fr;
      }
    }

    .doc-link {
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      background: var(--bg-source);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .doc-link:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .doc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.375rem;
    }

    .doc-link .doc-icon {
      width: 18px;
      height: 18px;
      color: var(--accent);
    }

    .doc-badge {
      font-size: 0.5625rem;
      font-weight: 600;
      padding: 0.125rem 0.375rem;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .doc-badge.binding {
      background: rgba(74, 222, 128, 0.15);
      color: var(--confidence-high);
    }

    .doc-badge.guidance {
      background: rgba(251, 191, 36, 0.15);
      color: var(--confidence-medium);
    }

    .doc-link .doc-name {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.125rem;
    }

    .doc-link .doc-desc {
      font-size: 0.625rem;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* ===== GET STARTED / QUESTION CHIPS ===== */
    .question-chips {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .question-chip {
      background: var(--bg-source);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.625rem 0.875rem;
      font-size: 0.75rem;
      font-family: inherit;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      line-height: 1.4;
    }

    .question-chip:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--text-on-accent);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    /* Staggered animations for welcome panel elements */
    .doc-link {
      animation: welcomeFadeIn 0.4s ease both;
    }

    .doc-link:nth-child(1) { animation-delay: 0.2s; }
    .doc-link:nth-child(2) { animation-delay: 0.25s; }
    .doc-link:nth-child(3) { animation-delay: 0.3s; }
    .doc-link:nth-child(4) { animation-delay: 0.35s; }

    .question-chip {
      animation: welcomeFadeIn 0.3s ease both;
    }

    .question-chip:nth-child(1) { animation-delay: 0.25s; }
    .question-chip:nth-child(2) { animation-delay: 0.3s; }
    .question-chip:nth-child(3) { animation-delay: 0.35s; }
    .question-chip:nth-child(4) { animation-delay: 0.4s; }

    @media (max-width: 640px) {
      .welcome-panel {
        padding: 1.5rem 1rem;
      }
    }

    /* ===== TYPING INDICATOR ===== */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem;
      background: var(--bg-bot-msg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      border-bottom-left-radius: var(--radius-sm);
      width: fit-content;
      min-width: 200px;
    }

    .typing-dots {
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    .typing-dot:nth-child(3) { animation-delay: 0s; }

    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .typing-status {
      display: flex;
      flex-direction: column;
      gap: 0.125rem;
    }

    .typing-message {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .typing-time {
      font-size: 0.6875rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .typing-retry {
      font-size: 0.75rem;
      color: var(--confidence-medium);
      font-weight: 500;
    }

    /* ===== INPUT AREA ===== */
    .input-area {
      padding: 1rem 1.5rem;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-container {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }

    .voice-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    .voice-btn:hover {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }

    .voice-btn svg {
      width: 20px;
      height: 20px;
      color: var(--text-secondary);
    }

    .voice-btn:hover svg {
      color: var(--accent);
    }
    
    .voice-btn.listening {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      animation: voice-pulse 1.5s ease-in-out infinite;
    }
    
    .voice-btn.listening svg {
      color: #ef4444;
    }
    
    @keyframes voice-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
    }

    /* ===== VOICE INPUT MODE (replaces textarea when active) ===== */
    .voice-input-mode {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      width: 100%;
      padding: 0.5rem 1rem;
      min-height: 46px;
    }
    
    .input-area.voice-active .message-input {
      display: none;
    }
    
    .input-area.voice-active .voice-input-mode {
      display: flex;
    }
    
    .input-area.voice-active .voice-btn {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }
    
    .input-area.voice-active .voice-btn svg {
      color: #ef4444;
    }
    
    /* Voice Input Orb */
    .voice-input-orb {
      position: relative;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .voice-input-orb-core {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, #a85a30 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      box-shadow: 0 0 20px rgba(201, 111, 60, 0.4);
    }
    
    .voice-input-orb-core svg {
      width: 18px;
      height: 18px;
      color: white;
    }
    
    .voice-input-orb-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
    }
    
    /* Listening state - expanding rings */
    /* Connecting state - subtle pulsing */
    .voice-input-mode[data-state="connecting"] .voice-input-orb-core {
      animation: voice-orb-connecting 0.8s ease-in-out infinite;
      opacity: 0.7;
    }
    
    @keyframes voice-orb-connecting {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1); opacity: 0.8; }
    }
    
    .voice-input-mode[data-state="listening"] .voice-input-orb-ring {
      animation: voice-ring-expand 2s ease-out infinite;
    }
    
    .voice-input-mode[data-state="listening"] .voice-input-orb-ring:nth-child(2) {
      animation-delay: 0.5s;
    }
    
    .voice-input-mode[data-state="listening"] .voice-input-orb-ring:nth-child(3) {
      animation-delay: 1s;
    }
    
    @keyframes voice-ring-expand {
      0% {
        transform: scale(1);
        opacity: 0.6;
      }
      100% {
        transform: scale(2.5);
        opacity: 0;
      }
    }
    
    /* Processing state - spinning glow */
    .voice-input-mode[data-state="processing"] .voice-input-orb-core {
      animation: voice-orb-processing 1s ease-in-out infinite;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }
    
    @keyframes voice-orb-processing {
      0%, 100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }
      50% { box-shadow: 0 0 35px rgba(245, 158, 11, 0.7); }
    }
    
    /* Speaking state - green pulse */
    .voice-input-mode[data-state="speaking"] .voice-input-orb-core {
      animation: voice-orb-speaking 0.6s ease-in-out infinite;
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
    }
    
    @keyframes voice-orb-speaking {
      0%, 100% { 
        transform: scale(1);
        box-shadow: 0 0 20px rgba(22, 163, 74, 0.4);
      }
      50% { 
        transform: scale(1.1);
        box-shadow: 0 0 30px rgba(22, 163, 74, 0.6);
      }
    }
    
    .voice-input-status {
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    
    .voice-input-mode[data-state="connecting"] .voice-input-status {
      color: var(--text-muted);
    }
    
    .voice-input-mode[data-state="listening"] .voice-input-status {
      color: #ef4444;
    }
    
    .voice-input-mode[data-state="processing"] .voice-input-status {
      color: #f59e0b;
    }
    
    .voice-input-mode[data-state="speaking"] .voice-input-status {
      color: #16a34a;
    }
    
    /* Voice Done Button - only visible during listening */
    .voice-done-btn {
      display: none;
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-pill);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .voice-done-btn:hover {
      background: #a85a30;
      transform: scale(1.05);
    }
    
    .voice-input-mode[data-state="listening"] .voice-done-btn {
      display: block;
    }
    
    /* Speaking indicator on bot messages */
    .message-bot.speaking .message-header-left::after {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #16a34a;
      border-radius: 50%;
      margin-left: 0.5rem;
      animation: speaking-dot 0.6s ease-in-out infinite;
    }
    
    @keyframes speaking-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    .message-input {
      width: 100%;
      padding: 0.75rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 0.9375rem;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: all 0.2s ease;
      min-height: 44px;
      max-height: 120px;
    }

    .message-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }

    .message-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius-pill);
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      color: var(--text-on-accent);
    }

    /* ===== ERROR STATE ===== */
    .error-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 0.875rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .error-message-content {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .error-message-content svg {
      flex-shrink: 0;
      margin-top: 0.125rem;
    }

    .error-message-text {
      flex: 1;
    }

    .error-message-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .error-message-detail {
      font-size: 0.8125rem;
      opacity: 0.9;
    }

    .error-actions {
      display: flex;
      gap: 0.5rem;
      margin-left: 1.5rem;
    }

    .error-retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.75rem;
      background: transparent;
      border: 1px solid currentColor;
      border-radius: var(--radius-pill);
      color: inherit;
      font-size: 0.75rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .error-retry-btn:hover {
      background: #dc2626;
      border-color: #dc2626;
      color: white;
    }

    .error-retry-btn svg {
      width: 12px;
      height: 12px;
    }

    [data-theme="dark"] .error-message,
    :root:not([data-theme="light"]) .error-message {
      background: #450a0a;
      border-color: #7f1d1d;
      color: #fca5a5;
    }

    [data-theme="dark"] .error-retry-btn:hover,
    :root:not([data-theme="light"]) .error-retry-btn:hover {
      background: #fca5a5;
      border-color: #fca5a5;
      color: #450a0a;
    }

    /* ===== CANCEL BUTTON STATE ===== */
    .send-btn.cancel-mode {
      background: var(--confidence-low);
    }

    .send-btn.cancel-mode:hover:not(:disabled) {
      background: #ef4444;
    }

    /* ===== SCROLLBAR ===== */
    .chat-area::-webkit-scrollbar,
    .source-modal-body::-webkit-scrollbar {
      width: 6px;
    }

    .chat-area::-webkit-scrollbar-track,
    .source-modal-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-area::-webkit-scrollbar-thumb,
    .source-modal-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .chat-area::-webkit-scrollbar-thumb:hover,
    .source-modal-body::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* ===== WELCOME META ===== */
    .welcome-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 1rem;
      line-height: 1.5;
    }

    .welcome-meta a {
      color: var(--accent);
      text-decoration: none;
    }

    .welcome-meta a:hover {
      text-decoration: underline;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .header {
        padding: 0.875rem 1rem;
      }

      .header h1 {
        font-size: 0.9375rem;
      }

      .header-icon {
        width: 32px;
        height: 32px;
      }

      .header-subtitle {
        font-size: 0.6rem;
      }
    }

    @media (max-width: 640px) {
      .header h1 {
        font-size: 0.875rem;
      }

      .header-subtitle {
        display: none;
      }

      .header-brand {
        gap: 0.625rem;
      }

      .chat-area {
        padding: 1rem;
      }

      .message {
        max-width: 92%;
      }

      .input-area {
        padding: 0.875rem 1rem;
      }

      .voice-btn span {
        display: none;
      }

      .app-footer {
        font-size: 0.5625rem;
      }
    }

    /* ===== PWA: OFFLINE BANNER ===== */
    .offline-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10000;
      background: var(--color-error, #dc2626);
      color: white;
      text-align: center;
      padding: 0.5rem 1rem;
      padding-top: calc(0.5rem + env(safe-area-inset-top));
      font-size: 0.8125rem;
      font-weight: 500;
      transform: translateY(-100%);
      transition: transform 0.3s ease;
    }
    
    .offline-banner.visible {
      transform: translateY(0);
    }
    
    .offline-banner.online {
      background: var(--color-success, #16a34a);
    }

    /* ===== PWA: INSTALL BANNER ===== */
    .install-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      padding: 1rem;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
    }
    
    .install-banner.visible {
      transform: translateY(0);
    }
    
    .install-banner-content {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      min-width: 0;
    }
    
    .install-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    
    .install-text {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 0;
    }
    
    .install-text strong {
      font-size: 0.9375rem;
      color: var(--text-primary);
    }
    
    .install-text span {
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    
    .install-text svg {
      flex-shrink: 0;
    }
    
    .install-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    
    .install-btn {
      background: var(--accent-orange);
      color: white;
      border: none;
      padding: 0.625rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      min-width: 44px;
      transition: background 0.2s ease;
    }
    
    .install-btn:hover {
      background: var(--accent-orange-hover, #b85a2a);
    }
    
    .install-dismiss {
      background: transparent;
      border: none;
      padding: 0.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      min-height: 44px;
      min-width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: background 0.2s ease;
    }
    
    .install-dismiss:hover {
      background: var(--bg-card);
    }

    /* ===== MOBILE: SAFE AREA HANDLING ===== */
    @supports (padding: env(safe-area-inset-top)) {
      .header {
        padding-top: calc(0.875rem + env(safe-area-inset-top));
      }
      
      .input-area {
        padding-bottom: calc(0.875rem + env(safe-area-inset-bottom));
      }
      
      .app-container {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }

    /* ===== MOBILE: TOUCH TARGETS ===== */
    @media (max-width: 768px) {
      /* Ensure minimum 44x44px touch targets */
      .question-chip {
        min-height: 44px;
        padding: 0.75rem 1rem;
      }
      
      .copy-answer-btn {
        min-height: 44px;
        min-width: 44px;
        padding: 0.75rem;
      }
      
      .source-toggle {
        min-height: 44px;
        padding: 0.75rem 1rem;
      }
      
      .source-item {
        min-height: 44px;
        padding: 0.75rem;
      }
      
      .theme-toggle {
        min-height: 44px;
        min-width: 44px;
        padding: 0.625rem;
      }
      
      .voice-btn {

    function startNewChat() {
      // Cancel any pending request
      if (currentAbortController) {
        wasCancelled = true;
        currentAbortController.abort();
        currentAbortController = null;
      }
      
      // Clear timers
      if (typingIntervalId) {
        clearInterval(typingIntervalId);
        typingIntervalId = null;
      }
      
      // Generate new session
      const newSessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substring(2, 11);
      sessionStorage.setItem('arc_session_id', newSessionId);
      
      // Clear messages and state
      messages = [];
      isLoading = false;
      lastMessageForRetry = null;
      
      // Reset UI with welcome panel (using shared function)
      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML = generateWelcomePanel();
      
      // Reset send button state
      resetSendButton();
      
      // Focus input
      document.getElementById('messageInput').focus();
    }

    // ===== SUGGESTED QUESTIONS =====
    function askSuggestedQuestion(button) {
      const question = button.textContent;
      const input = document.getElementById('messageInput');
      input.value = question;
      sendMessage();
    }

    // ===== THEME MANAGEMENT =====
    function initTheme() {
      const savedTheme = localStorage.getItem('arc_theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
      // Dark theme is default (no data-theme attribute = dark)
      // Only set light if user explicitly chose it or prefers light
      else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      // If currently light, switch to dark (remove attribute); if dark/none, switch to light
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      if (newTheme === 'dark') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
      localStorage.setItem('arc_theme', newTheme);
    }

    // ===== INPUT HANDLING =====
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    // ===== MESSAGE RENDERING =====
    function renderUserMessage(text) {
      return `
        <div class="message message-user">
          <div class="message-content">
            ${escapeHtml(text)}
          </div>
        </div>
      `;
    }

    function renderBotMessage(response) {
      const rawAnswer = response.answer || response.response || 'No response received.';
      const sources = response.sources || [];
      let confidence = response.confidence || null;
      
      // Try to extract confidence from answer text if not provided separately
      if (!confidence || !confidence.level) {
        const confidenceMatch = rawAnswer.match(/\*\*Confidence:\*\*\s*(High|Medium|Low)/i) ||
                                rawAnswer.match(/Confidence:\s*(High|Medium|Low)/i);
        if (confidenceMatch) {
          const level = confidenceMatch[1];
          const explanationMatch = rawAnswer.match(/Confidence:\s*(?:High|Medium|Low)\s*[—–-]\s*([^\n]+)/i);
          confidence = {
            level: level.charAt(0).toUpperCase() + level.slice(1).toLowerCase(),
            explanation: explanationMatch ? explanationMatch[1].trim() : ''
          };
        } else {
          confidence = { level: 'Unknown', explanation: '' };
        }
      }
      
      // Clean answer text - remove confidence section and section headers
      let cleanAnswer = rawAnswer
        .replace(/\*\*Confidence:\*\*[^\n]*/gi, '')
        .replace(/Confidence:\s*(?:High|Medium|Low)\s*[—–-][^\n]*/gi, '')
        .replace(/\*\*Short Answer:?\*\*\s*/gi, '')
        .replace(/\*\*Requirements:?\*\*\s*/gi, '')
        .replace(/\*\*Sources:?\*\*[\s\S]*$/gi, '') // Remove sources section from text
        .replace(/\*\*What to Submit:?\*\*\s*/gi, '')
        .replace(/\*\*Additional Notes:?\*\*\s*/gi, '')
        .trim();
      
      const confidenceClass = confidence.level ? confidence.level.toLowerCase() : 'unknown';
      const messageId = 'msg-' + Date.now() + '-' + Math.random().toString(36).substring(2, 7);
      
      // Build sources section with requirements
      let sourcesHtml = '';
      const validSources = sources.filter(s => s && (s.content || s.section_title || s.document_name));
      if (validSources.length > 0) {
        sourcesHtml = `
          <div class="sources-section">
            <div class="sources-title">Sources & Requirements</div>
            ${validSources.map((source, index) => renderSourceWithRequirements(source, index, messageId)).join('')}
          </div>
        `;
      }

      return `
        <div class="message message-bot" id="${messageId}">
          <div class="message-content">
            <div class="message-header">

                <span class="message-sender">ARC Bot</span>
              </div>
              <div class="message-header-right">

                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>

                  <div class="waveform">
                    <span></span><span></span><span></span><span></span><span></span>
                  </div>
                </button>
                <button class="copy-btn" onclick="copyAnswer(this, '${messageId}')" title="Copy answer">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                </button>
              </div>
            </div>
            <div class="answer-section">
              <div class="answer-label">Answer</div>
              <div class="answer-text" data-raw-answer="${escapeHtml(cleanAnswer)}">
                ${formatAnswerText(cleanAnswer)}
              </div>
            </div>
            ${sourcesHtml}
          </div>
        </div>
      `;
    }

    function renderSourceWithRequirements(source, index, messageId) {
      const hierarchy = source.section_hierarchy || [];
      const title = source.section_title || hierarchy[hierarchy.length - 1] || 'Unknown Section';
      const docName = source.document_name || 'Document';
      const content = source.content || 'Source content not available.';
      let requirements = source.requirements || [];
      const isBinding = source.is_binding !== false;
      
      // If no requirements provided, try intelligent extraction from content
      if (requirements.length === 0 && content) {
        requirements = extractRequirementsFromContent(content);
      }
      
      // Determine authority type based on document name
      const docNameLower = docName.toLowerCase();
      let authorityType, authorityLabel;

      if (docNameLower.includes('cc&r') || docNameLower.includes('ccr') || docNameLower.includes('declaration')) {
        authorityType = 'binding';
        authorityLabel = 'Binding';
      } else if (docNameLower.includes('city of bend') || docNameLower.includes('development code') || docNameLower.includes('bdc')) {
        authorityType = 'binding';
        authorityLabel = 'Binding';
      } else if (docNameLower.includes('design guideline') || docNameLower.includes('architectural')) {
        authorityType = 'guidance';
        authorityLabel = 'ARC Guidance';
      } else if (docNameLower.includes('rules') || docNameLower.includes('regulation')) {
        authorityType = 'guidance';
        authorityLabel = 'DWOA Guidance';
      } else {
        // Fallback based on is_binding flag
        authorityType = isBinding ? 'binding' : 'guidance';
        authorityLabel = isBinding ? 'Binding' : 'Guidance';
      }
      
      // Build full breadcrumb path: Document › Hierarchy › Section Title
      const pathParts = [docName];
      if (hierarchy.length > 0) {
        pathParts.push(...hierarchy);
      }
      if (title && !hierarchy.includes(title) && title !== docName) {
        pathParts.push(title);
      }
      const path = pathParts.join(' › ');
      
      const sourceId = `${messageId}-source-${index}`;
      
      // Build requirements list HTML with "Key Requirements" label
      let requirementsHtml = '';
      if (requirements.length > 0) {
        requirementsHtml = `
          <div class="source-requirements">
            <div class="requirements-label">Key Requirements</div>
            <ul>
              ${requirements.map(req => `<li>${escapeHtml(req)}</li>`).join('')}
            </ul>
          </div>
        `;
      }
      
      // Escape content and path for onclick attribute
      const escapedContent = content.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      const escapedPath = path.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      
      return `
        <div class="source-item" id="${sourceId}">
          <div class="source-header">
            <div class="source-info">
              <div class="source-path">${escapeHtml(path)}</div>
              <div class="source-meta">
                <span class="authority-badge authority-${authorityType}">${authorityLabel}</span>
              </div>
            </div>
          </div>
          ${requirementsHtml}
          <button class="view-source-link" onclick="openSourceModal('${escapedPath}', '${escapedContent}')">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            View source text
          </button>
        </div>
      `;
    }
    
    // Intelligent requirement extraction from content
    function extractRequirementsFromContent(content) {
      if (!content) return [];
      const requirements = [];
      
      // 1. Explicit bullets (-, •, *, numbered)
      const bulletMatches = content.match(/^[\s]*[-•*]\s+(.+)$/gm);
      if (bulletMatches) {
        bulletMatches.forEach(match => {
          const text = match.replace(/^[\s]*[-•*]\s+/, '').trim();
          if (text.length > 15 && text.length < 200) {
            requirements.push(text);
          }
        });
      }
      
      const numberedMatches = content.match(/^[\s]*\d+[.)]\s+(.+)$/gm);
      if (numberedMatches) {
        numberedMatches.forEach(match => {
          const text = match.replace(/^[\s]*\d+[.)]\s+/, '').trim();
          if (text.length > 15 && text.length < 200) {
            requirements.push(text);
          }
        });
      }
      
      // 2. Measurement patterns (numbers with units)
      const measurementPattern = /[^.]*\b(\d+)\s*(feet|foot|ft|inches|inch|days?|percent|%|square feet|sq\.?\s*ft)[^.]*\./gi;
      const measurementMatches = content.match(measurementPattern);
      if (measurementMatches) {
        measurementMatches.forEach(match => {
          const text = match.trim();
          if (text.length > 15 && text.length < 200 && !requirements.includes(text)) {
            requirements.push(text);
          }
        });
      }
      
      // 3. Requirement keywords
      const keywordPattern = /[^.]*\b(must|shall|required|prohibited|not permitted|not allowed|maximum|minimum|limited to|cannot exceed|may not)[^.]*\./gi;
      const keywordMatches = content.match(keywordPattern);
      if (keywordMatches) {
        keywordMatches.forEach(match => {
          const text = match.trim();
          if (text.length > 15 && text.length < 200 && !requirements.includes(text)) {
            requirements.push(text);
          }
        });
      }
      
      // Dedupe and limit to 7
      const unique = [...new Set(requirements)];
      return unique.slice(0, 7);
    }

      if (!text) return '';
      
      let html = escapeHtml(text);
      
      // Bold: **text**
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      
      // Handle bullet lists first before line breaks
      const lines = html.split('\n');
      let inList = false;
      let result = [];
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('- ')) {
          if (!inList) {
            result.push('<ul>');
            inList = true;
          }
          result.push(`<li>${line.substring(2)}</li>`);
        } else {
          if (inList) {
            result.push('</ul>');
            inList = false;
          }
          if (line) {
            result.push(`<p>${line}</p>`);
          }
        }
      }
      if (inList) {
        result.push('</ul>');
      }
      
      html = result.join('');
      
      // Clean up empty paragraphs
      html = html.replace(/<p><\/p>/g, '');
      
      return html || '<p>No answer available.</p>';
    }

    // ===== ERROR CLASSIFICATION =====
    const ErrorTypes = {
      NETWORK: 'network',
      TIMEOUT: 'timeout',
      CANCELLED: 'cancelled',
      SERVER: 'server',
      RATE_LIMITED: 'rate_limited',
      BAD_RESPONSE: 'bad_response',
      UNKNOWN: 'unknown'
    };

    function classifyError(error, response = null) {
      // User cancelled
      if (wasCancelled) {
        return ErrorTypes.CANCELLED;
      }
      
      // Abort errors (timeout or cancel)
      if (error.name === 'AbortError') {
        return ErrorTypes.TIMEOUT;
      }
      
      // Network errors
      if (error instanceof TypeError || !navigator.onLine) {
        return ErrorTypes.NETWORK;
      }
      
      // HTTP status-based errors
      if (response) {
        if (response.status === 429) return ErrorTypes.RATE_LIMITED;
        if (response.status >= 500) return ErrorTypes.SERVER;
      }
      
      // Check error message for clues
      if (error.message && error.message.includes('JSON')) {
        return ErrorTypes.BAD_RESPONSE;
      }
      
      return ErrorTypes.UNKNOWN;
    }

    function getErrorDetails(errorType, elapsedTime = null) {

          icon: 'clock',
          canRetry: true
        },
        [ErrorTypes.CANCELLED]: {
          title: 'Request cancelled',
          message: 'You cancelled the request.',
          icon: 'x-circle',
          canRetry: false
        },
        [ErrorTypes.SERVER]: {
          title: 'Server error',
          message: 'The server encountered an error. Please try again in a moment.',
          icon: 'server',
          canRetry: true
        },
        [ErrorTypes.RATE_LIMITED]: {
          title: 'Too many requests',
          message: 'Please wait a moment before sending another message.',
          icon: 'alert-triangle',

        },
        [ErrorTypes.BAD_RESPONSE]: {

        },
        [ErrorTypes.UNKNOWN]: {
          title: 'Something went wrong',
          message: 'An unexpected error occurred. Please try again.',
          icon: 'alert-circle',

        }
      };
      
      return details[errorType] || details[ErrorTypes.UNKNOWN];
    }

    // ===== UTILITIES =====
    function escapeHtml(text) {
      if (!text) return '';

    function formatMarkdown(text) {
      if (!text) return '';
      
      // Basic markdown formatting
      let html = escapeHtml(text);
      
      // Bold: **text**
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      
      // Line breaks
      html = html.replace(/\n\n/g, '</p><p>');
      html = html.replace(/\n/g, '<br>');
      
      // Bullet lists: - item
      html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
      // Clean up multiple ul tags
      html = html.replace(/<\/ul>\s*<ul>/g, '');
      
      // Numbered lists: 1. item
      html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
      
      // Wrap in paragraph if not already structured
      if (!html.startsWith('<')) {
        html = '<p>' + html + '</p>';
      }
      
      return html;
    }

    function cancelCurrentRequest() {
      if (currentAbortController) {
        wasCancelled = true;
        currentAbortController.abort();

    // ===== RETRY LOGIC =====
    function isRetryableError(errorType) {
      return [
        ErrorTypes.NETWORK,
        ErrorTypes.TIMEOUT,
        ErrorTypes.SERVER
      ].includes(errorType);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function sendMessageAttempt(message, signal) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: message,
          session_id: getSessionId()
        }),
        signal: signal
      });
      
      // Store response for error classification
      if (!response.ok) {
        const error = new Error(`HTTP error! status: ${response.status}`);
        error.response = response;
        throw error;
      }
      
      const data = await response.json();
      return data;
    }

    async function sendMessageWithRetry(message, signal) {
      let lastError;
      let lastErrorType = ErrorTypes.UNKNOWN;
      
      for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
        try {
          // Reset cancelled flag at start of each attempt
          if (attempt === 1) wasCancelled = false;
          
          return await sendMessageAttempt(message, signal);
        } catch (error) {
          lastError = error;
          lastErrorType = classifyError(error, error.response);
          
          // Don't retry if cancelled or not retryable
          if (wasCancelled || !isRetryableError(lastErrorType)) {
            throw error;
          }
          
          // Don't retry on last attempt
          if (attempt === MAX_RETRIES) {
            throw error;
          }
          
          // Calculate delay with exponential backoff
          const delay = Math.pow(2, attempt - 1) * RETRY_DELAY_BASE_MS;
          
          // Update UI for retry
          updateTypingIndicator(
            `Retrying...`,
            `Attempt ${attempt + 1} of ${MAX_RETRIES} in ${delay / 1000}s`
          );
          
          await sleep(delay);
          
          // Update message after delay
          updateTypingIndicator('Searching documents...', `Attempt ${attempt + 1} of ${MAX_RETRIES}`);
        }
      }
      
      throw lastError;
    }

    // ===== API COMMUNICATION =====
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      
      if (!message || isLoading) return;
      
      // Store for potential retry
      lastMessageForRetry = message;
      wasCancelled = false;
      
      // Clear input
      input.value = '';
      autoResize(input);
      
      // Remove welcome panel if present
      const welcomePanel = document.querySelector('.welcome-panel');
      if (welcomePanel) {
        welcomePanel.remove();
      }
      
      // Add user message to UI
      const chatArea = document.getElementById('chatArea');
      chatArea.insertAdjacentHTML('beforeend', renderUserMessage(message));
      
      // Show typing indicator with progress
      showTypingIndicator();
      
      // Set up abort controller with timeout
      currentAbortController = new AbortController();
      const timeoutId = setTimeout(() => {
        if (currentAbortController) {
          currentAbortController.abort();
        }
      }, REQUEST_TIMEOUT_MS);
      
      // Switch to cancel mode
      isLoading = true;
      input.disabled = true;
      setSendButtonMode('cancel');
      
      let elapsedTime = null;
      
      try {
        const data = await sendMessageWithRetry(message, currentAbortController.signal);
        
        // Calculate elapsed time
        if (typingStartTime) {
          elapsedTime = Math.floor((Date.now() - typingStartTime) / 1000);
        }
        
        // Remove typing indicator
        hideTypingIndicator();
        
        // Add bot response
        chatArea.insertAdjacentHTML('beforeend', renderBotMessage(data));
        
        // Store message
        messages.push({ role: 'user', content: message });
        messages.push({ role: 'assistant', content: data });
        
        // Clear retry message on success
        lastMessageForRetry = null;
        
      } catch (error) {
        console.error('Error sending message:', error);
        
        // Calculate elapsed time for error message
        if (typingStartTime) {
          elapsedTime = Math.floor((Date.now() - typingStartTime) / 1000);
        }
        
        // Remove typing indicator
        hideTypingIndicator();
        
        // Classify and show appropriate error
        const errorType = classifyError(error, error.response);
        
        // Don't show error message if user cancelled
        if (errorType !== ErrorTypes.CANCELLED) {
          chatArea.insertAdjacentHTML('beforeend', renderError(errorType, elapsedTime));
        }
      } finally {
        // Clear timeout
        clearTimeout(timeoutId);

        resetSendButton();
        input.disabled = false;
        input.focus();

      scrollToBottom();
    }

    // ===== VOICE MODE =====
    const VOICE_API_URL = 'https://n8n.srv1208741.hstgr.cloud/webhook/arc-voice-session';
    const TTS_API_URL = 'https://n8n.srv1208741.hstgr.cloud/webhook/arc-tts';
    
    // Voice state
    let voiceState = 'idle'; // idle, connecting, listening, processing, speaking
    let peerConnection = null;
    let dataChannel = null;
    let localStream = null;
    let voiceSessionActive = false;
    let voiceMode = false;
    let currentVoiceTranscript = ''; // Track current user speech
    let currentTTSAudio = null; // Track currently playing TTS audio
    let transcriptionTimeout = null; // Timeout for transcription recovery
    
    // ===== TEXT-TO-SPEECH =====
    // Track if we're currently preparing/playing TTS
    let ttsAudioUrl = null;
    
    async function speakMessage(button) {
      // If already speaking, stop
      if (button.classList.contains('speaking') || button.classList.contains('loading')) {
        stopSpeaking();
        return;
      }
      
      // Stop any currently playing audio
      stopSpeaking();
      
      const messageEl = button.closest('.message-bot');
      if (!messageEl) return;
      
      // Get the answer text
      const answerTextEl = messageEl.querySelector('.answer-text');
      if (!answerTextEl) return;
      
      const text = answerTextEl.getAttribute('data-raw-answer') || answerTextEl.textContent;
      if (!text || text.trim().length === 0) return;
      
      // Show loading state immediately
      button.classList.add('loading');
      if (voiceMode) {
        setVoiceInputState('speaking');
      }
      
      console.log('[TTS] Starting audio fetch for', text.length, 'chars');
      const startTime = performance.now();
      
      try {
        // Fetch TTS audio with streaming support
        const response = await fetch(TTS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text.trim() })
        });
        
        if (!response.ok) {
          throw new Error('TTS request failed');
        }
        
        console.log('[TTS] Response received in', Math.round(performance.now() - startTime), 'ms');
        
        // Try streaming playback first, fall back to blob if needed
        const playedStreaming = await tryStreamingPlayback(response, button);
        
        if (!playedStreaming) {
          console.log('[TTS] Streaming not available, using blob fallback');
          // Response already consumed, need to re-fetch
          await playAudioBlob(text.trim(), button);
        }
        
      } catch (error) {
        console.error('[TTS] Error:', error);
        button.classList.remove('loading', 'speaking');
        if (voiceMode) {
          stopVoiceMode();
        }
        
        // Show brief error feedback
        button.title = 'Audio unavailable';
        setTimeout(() => {
          button.title = 'Read aloud';
        }, 2000);
      }
    }
    
    // Try to play audio using MediaSource for streaming (faster start)
    async function tryStreamingPlayback(response, button) {
      // Check if MediaSource is supported and can handle audio/mpeg
      if (!window.MediaSource || !MediaSource.isTypeSupported('audio/mpeg')) {
        console.log('[TTS] MediaSource not supported for audio/mpeg');
        return false;
      }
      
      try {
        const mediaSource = new MediaSource();
        const audio = new Audio();
        ttsAudioUrl = URL.createObjectURL(mediaSource);
        audio.src = ttsAudioUrl;
        currentTTSAudio = audio;
        
        return new Promise((resolve, reject) => {
          mediaSource.addEventListener('sourceopen', async () => {
            try {
              const sourceBuffer = mediaSource.addSourceBuffer('audio/mpeg');
              const reader = response.body.getReader();
              let firstChunk = true;
              
              const pump = async () => {
                const { done, value } = await reader.read();
                
                if (done) {
                  // Wait for buffer to finish updating before ending stream
                  if (!sourceBuffer.updating) {
                    mediaSource.endOfStream();
                  } else {
                    sourceBuffer.addEventListener('updateend', () => {
                      if (mediaSource.readyState === 'open') {
                        mediaSource.endOfStream();
                      }
                    }, { once: true });
                  }
                  return;
                }
                
                // Append chunk to buffer
                if (!sourceBuffer.updating) {
                  sourceBuffer.appendBuffer(value);
                }
                
                // Start playing on first chunk
                if (firstChunk) {
                  firstChunk = false;
                  console.log('[TTS] First chunk received, starting playback');
                  button.classList.remove('loading');
                  button.classList.add('speaking');
                  
                  try {
                    await audio.play();
                    resolve(true);
                  } catch (playError) {
                    console.error('[TTS] Autoplay failed:', playError);
                    reject(playError);
                  }
                }
                
                // Wait for buffer to be ready, then continue
                if (sourceBuffer.updating) {
                  sourceBuffer.addEventListener('updateend', pump, { once: true });
                } else {
                  pump();
                }
              };
              
              pump();
              
            } catch (e) {
              console.error('[TTS] Streaming error:', e);
              reject(e);
            }
          });
          
          // Handle audio ending
          audio.onended = () => {
            console.log('[TTS] Streaming audio finished');
            button.classList.remove('speaking');
            cleanupTTSAudio();
            
            // Exit voice mode after speaking
            if (voiceMode) {
              console.log('[TTS] Audio finished, exiting voice mode');
              stopVoiceMode();
            }
          };
          
          audio.onerror = (e) => {
            console.error('[TTS] Audio error:', e);
            reject(e);
          };
          
          // Timeout in case streaming doesn't work
          setTimeout(() => {
            if (audio.paused && firstChunk) {
              reject(new Error('Streaming timeout'));
            }
          }, 10000);
        });
        
      } catch (e) {
        console.log('[TTS] Streaming setup failed:', e);
        return false;
      }
    }
    
    // Fallback: Play audio using blob (waits for full download)
    async function playAudioBlob(text, button) {
      const response = await fetch(TTS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      
      if (!response.ok) {
        throw new Error('TTS request failed');
      }
      
      const audioBlob = await response.blob();
      ttsAudioUrl = URL.createObjectURL(audioBlob);
      
      currentTTSAudio = new Audio(ttsAudioUrl);
      
      currentTTSAudio.onplay = () => {
        button.classList.remove('loading');
        button.classList.add('speaking');
      };
      
      currentTTSAudio.onended = () => {
        button.classList.remove('speaking');
        cleanupTTSAudio();
        
        // Exit voice mode after speaking
        if (voiceMode) {
          console.log('[TTS] Audio finished, exiting voice mode');
          stopVoiceMode();
        }
      };
      
      currentTTSAudio.onerror = (e) => {
        console.error('[TTS] Audio playback error:', e);
        button.classList.remove('loading', 'speaking');
        cleanupTTSAudio();
      };
      
      console.log('[TTS] Playing blob audio');
      await currentTTSAudio.play();
    }
    
    // Clean up TTS audio resources
    function cleanupTTSAudio() {
      if (ttsAudioUrl) {
        URL.revokeObjectURL(ttsAudioUrl);
        ttsAudioUrl = null;
      }
      currentTTSAudio = null;
    }
    
    function stopSpeaking() {
