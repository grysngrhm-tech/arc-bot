    async function startVoiceCapture() {
      try {
        // Request microphone permission
        setVoiceInputState('connecting');
        currentVoiceTranscript = '';
        
        // Check if microphone is available
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error('Microphone not supported in this browser');
        }
        
        // Get ephemeral token from backend
        const tokenResponse = await fetch(VOICE_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: getSessionId() })
        });
        
        if (!tokenResponse.ok) {
          throw new Error('Failed to get voice session token');
        }
        
        const tokenData = await tokenResponse.json();
        
        if (!tokenData.client_secret || !tokenData.client_secret.value) {
          throw new Error('Invalid token response from server');
        }
        
        // Initialize WebRTC connection
        await initializeVoiceSession(tokenData.client_secret.value);
        
      } catch (error) {
        console.error('[Voice] Error starting capture:', error);
        setVoiceInputState('idle');
        
        if (error.name === 'NotAllowedError') {
          showVoiceError('Microphone permission denied. Please allow microphone access.');
        } else if (error.name === 'NotFoundError') {
          showVoiceError('No microphone found. Please connect a microphone.');
        } else {
          showVoiceError(error.message || 'Failed to start voice mode');
        }
      }
    }
    
    async function initializeVoiceSession(ephemeralKey) {
      // Create peer connection
      peerConnection = new RTCPeerConnection();
      
      // Note: We don't set up ontrack for audio output since we use TTS API instead
      // This avoids browser autoplay policy issues and ensures consistent voice
      
      // Get microphone stream
      localStream = await navigator.mediaDevices.getUserMedia({ 
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        } 
      });
      
      // Add audio track to peer connection
      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });
      
      // Create data channel for events
      dataChannel = peerConnection.createDataChannel('oai-events');
      dataChannel.onopen = () => {
        console.log('[Voice] Data channel opened');
        voiceSessionActive = true;
        configureVoiceSession();
      };
      
      dataChannel.onmessage = handleVoiceEvent;
      
      dataChannel.onclose = () => {
        console.log('[Voice] Data channel closed');
        voiceSessionActive = false;
      };
      
      // Create and set local description
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      
      // Connect to OpenAI Realtime API
      const baseUrl = 'https://api.openai.com/v1/realtime';
      const model = 'gpt-4o-realtime-preview-2024-12-17';
      
      const sdpResponse = await fetch(`${baseUrl}?model=${model}`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${ephemeralKey}`,
          'Content-Type': 'application/sdp'
        },
        body: offer.sdp
      });
      
      if (!sdpResponse.ok) {
        throw new Error('Failed to connect to OpenAI Realtime API');
      }
      
      const answerSdp = await sdpResponse.text();
      await peerConnection.setRemoteDescription({
        type: 'answer',
        sdp: answerSdp
      });
      
      setVoiceInputState('listening');
    }
    
    function configureVoiceSession() {
      if (!dataChannel || dataChannel.readyState !== 'open') return;
      
      // Configure session with meta-prompt that delegates to Main Agent
      // Note: modalities is text-only - we use our own TTS for audio output
      const sessionConfig = {
        type: 'session.update',
        session: {
          modalities: ['text'],
          instructions: `You are a voice interface for ARC Bot, the Discovery West architectural assistant in Bend, Oregon.

CRITICAL RULE: You do NOT have architectural knowledge. For ANY question about:
- Architectural guidelines, requirements, or standards
- CC&Rs, covenants, conditions, or restrictions
- Community rules and regulations
- Approval processes or procedures
- Building codes, zoning, or development requirements
- Fences, landscaping, paint colors, roofing, or exterior modifications
- Setbacks, height limits, or property boundaries

You MUST call the get_arc_answer function and then read the response naturally to the user.

DO NOT attempt to answer architectural questions from your own knowledge. ALWAYS use the get_arc_answer tool first.

After receiving the answer from the tool:
1. Read the answer conversationally and naturally
2. You may paraphrase slightly for better speech flow, but preserve ALL specific details, measurements, percentages, and requirements exactly
3. Include the source citations naturally (e.g., "According to the Design Guidelines..." or "This is from the CC&Rs...")
4. If the answer includes a confidence warning, mention it

For simple greetings, clarifying questions, or requests to repeat, you may respond directly without using the tool.`,
          input_audio_transcription: {
            model: 'whisper-1'
          },
          turn_detection: {
            type: 'server_vad',
            threshold: 0.5,
            prefix_padding_ms: 300,
            silence_duration_ms: 1200  // Increased from 500ms for more reliable detection
          },
          tools: [
            {
              type: 'function',
              name: 'get_arc_answer',
              description: 'Get the authoritative answer to any question about Discovery West architectural guidelines, CC&Rs, rules, or regulations. Returns a complete, cited answer from official documents. You MUST use this for any architectural or community rule question.',
              parameters: {
                type: 'object',
                properties: {
                  question: {
                    type: 'string',
                    description: 'The user\'s question about architectural guidelines, CC&Rs, or community rules'
                  }
                },
                required: ['question']
              }
            }
          ]
        }
      };
      
      dataChannel.send(JSON.stringify(sessionConfig));
    }
    
    async function handleVoiceEvent(event) {
      try {
        const data = JSON.parse(event.data);
        // Log all events with full data for debugging
        console.log('[Voice] Event:', data.type, data);
        
        switch (data.type) {
          case 'session.created':
          case 'session.updated':
            console.log('[Voice] Session configured');
            break;
            
          case 'input_audio_buffer.speech_started':
            setVoiceInputState('listening');
            // Update status to show speech is being detected
            const statusText = document.getElementById('voiceInputStatus');
            if (statusText) {
              statusText.textContent = 'Hearing you...';
            }
            break;
            
          case 'input_audio_buffer.speech_stopped':
            setVoiceInputState('processing');
            // Set timeout in case transcription never arrives
            if (transcriptionTimeout) clearTimeout(transcriptionTimeout);
            transcriptionTimeout = setTimeout(() => {
              console.error('[Voice] Transcription timeout - no response received');
              showVoiceError('No transcription received. Please try again.');
            }, 30000);
            break;
            
          case 'conversation.item.input_audio_transcription.completed':
            // Clear transcription timeout
            if (transcriptionTimeout) {
              clearTimeout(transcriptionTimeout);
              transcriptionTimeout = null;
            }
            if (data.transcript && data.transcript.trim()) {
              currentVoiceTranscript = data.transcript.trim();
              // Add user's spoken question to chat
              const chatArea = document.getElementById('chatArea');
              if (chatArea) {
                chatArea.insertAdjacentHTML('beforeend', renderUserMessage(currentVoiceTranscript));
                scrollToBottom();
                messages.push({ role: 'user', content: currentVoiceTranscript });
              }
            }
            break;
            
          case 'response.function_call_arguments.done':
            // Handle function call (get answer from Main Agent)
            if (data.name === 'get_arc_answer') {
              await handleGetAnswer(data.call_id, data.arguments);
            }
            break;
            
          case 'response.done':
            // Response cycle complete
            // Don't reset to listening here - let TTS completion handle the exit
            // This prevents the "bounce back to listening" bug
            console.log('[Voice] Response cycle complete');
            break;
            
          case 'error':
            console.error('[Voice] API Error:', data.error);
            showVoiceError(data.error?.message || 'An error occurred');
            setVoiceInputState('idle');
            break;
            
          default:
            // Log unhandled events for debugging
            console.log('[Voice] Unhandled event:', data.type);
        }
      } catch (e) {
        console.error('[Voice] Error handling event:', e);
      }
    }
    
    async function handleGetAnswer(callId, argsString) {
      try {
        const args = JSON.parse(argsString);
        const question = args.question;
        
        console.log('[Voice] Getting answer for:', question);
        
        // Call the Main Agent endpoint (same as text mode)
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: question,
            session_id: getSessionId() // Share session with text mode for continuity
          })
        });
        
        let voiceAnswer = '';
        let responseData = null;
        
        if (response.ok) {
          responseData = await response.json();
          
          // RENDER IN CHAT with full formatting (source cards, confidence badges, etc.)
          const chatArea = document.getElementById('chatArea');
          if (chatArea && responseData.answer) {
            chatArea.insertAdjacentHTML('beforeend', renderBotMessage(responseData));
            scrollToBottom();
            messages.push({ role: 'assistant', content: responseData.answer });
            
            // AUTO-SPEAK: Find the speak button in the new message and trigger TTS
            const newMessage = chatArea.querySelector('.message-bot:last-child');
            const speakBtn = newMessage?.querySelector('.speak-btn');
            if (speakBtn) {
              // Small delay to ensure DOM is ready
              setTimeout(() => speakMessage(speakBtn), 100);
            }
          }
          
          // Format the answer for Realtime API acknowledgment
          voiceAnswer = formatAnswerForVoice(responseData);
        } else {
          voiceAnswer = 'I encountered an error while searching the documents. Please try asking your question again.';
          
          // Show error in chat
          const chatArea = document.getElementById('chatArea');
          if (chatArea) {
            chatArea.insertAdjacentHTML('beforeend', renderError(ErrorTypes.SERVER_ERROR, { 
              retryable: false,
              errorTitle: 'Voice Search Error',
              errorMessage: 'Failed to get response from the server.'
            }));
            scrollToBottom();
          }
        }
        
        // Send acknowledgment to Realtime API that function completed
        // (Audio is handled by our TTS webhook, not Realtime API)
        const functionResult = {
          type: 'conversation.item.create',
          item: {
            type: 'function_call_output',
            call_id: callId,
            output: voiceAnswer
          }
        };
        
        if (dataChannel && dataChannel.readyState === 'open') {
          dataChannel.send(JSON.stringify(functionResult));
          // Complete the response cycle so Realtime API is ready for next input
          dataChannel.send(JSON.stringify({ type: 'response.create' }));
        }
        
      } catch (error) {
        console.error('[Voice] Get answer error:', error);
        
        // Show error in chat
        const chatArea = document.getElementById('chatArea');
        if (chatArea) {
          chatArea.insertAdjacentHTML('beforeend', renderError(ErrorTypes.NETWORK_ERROR, {
            retryable: false,
            errorTitle: 'Voice Error',
            errorMessage: error.message || 'An error occurred while getting your answer.'
          }));
          scrollToBottom();
        }
        
        // Send error result to voice API
        if (dataChannel && dataChannel.readyState === 'open') {
          dataChannel.send(JSON.stringify({
            type: 'conversation.item.create',
            item: {
              type: 'function_call_output',
              call_id: callId,
              output: 'I encountered an error while getting your answer. Please try again.'
            }
          }));
          dataChannel.send(JSON.stringify({ type: 'response.create' }));
        }
      }
    }
    
    // Format answer for natural voice delivery (separate from chat rendering)
    function formatAnswerForVoice(data) {
      if (!data || !data.answer) {
        return 'I could not find specific information about that in the Discovery West governing documents. You may want to contact the ARC directly for clarification.';
      }
      
      let voiceAnswer = data.answer;
      
      // Add source citation naturally for voice
      if (data.sources && data.sources.length > 0) {
        const sourceNames = [...new Set(data.sources.map(s => 
          s.document || s.document_name || 'the governing documents'
        ))];
        
        if (sourceNames.length === 1) {
          voiceAnswer += ` This information comes from ${sourceNames[0]}.`;
        } else if (sourceNames.length > 1) {
          voiceAnswer += ` This information comes from ${sourceNames.slice(0, -1).join(', ')} and ${sourceNames[sourceNames.length - 1]}.`;
        }
      }
      
      // Add confidence caveat for low confidence answers
      if (data.confidence && data.confidence.level === 'Low') {
        voiceAnswer += ` Note that I'm not fully confident in this answer. You may want to verify with the ARC directly.`;
      }
      
      return voiceAnswer;
    }
    
    function stopVoiceCapture() {
      setVoiceInputState('idle');
      
      // Send end of input if session is active
      if (dataChannel && dataChannel.readyState === 'open') {
        try {
          dataChannel.send(JSON.stringify({ type: 'input_audio_buffer.commit' }));
        } catch (e) {
          console.error('[Voice] Error committing audio:', e);
        }
      }
    }
    
    function cleanupVoiceSession() {
      voiceSessionActive = false;
      
      // Close data channel
      if (dataChannel) {
        dataChannel.close();
        dataChannel = null;
      }
      
      // Close peer connection
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      
      // Stop local media stream
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      
      // Reset voice transcript tracker
      currentVoiceTranscript = '';
    }

    // ===== INITIALIZATION =====

    async function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        try {
          const registration = await navigator.serviceWorker.register('./sw.js');
          console.log('[PWA] Service worker registered:', registration.scope);
          
          // Handle updates
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // New content available, could prompt user to refresh
                console.log('[PWA] New version available');
              }
            });
          });
        } catch (error) {
          console.error('[PWA] Service worker registration failed:', error);
        }
      }

    // ===== PWA: INSTALL PROMPT HANDLING =====
    function setupInstallPrompt() {
      // Check if already installed
      if (window.matchMedia('(display-mode: standalone)').matches) {
        isAppInstalled = true;
        hideInstallBanner();
        return;
      }
      
      // Listen for beforeinstallprompt (Android/Desktop)
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        showInstallBanner('android');
      });
      
      // Detect iOS
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS && !isAppInstalled && !localStorage.getItem('arc-install-dismissed')) {
        // Show iOS install instructions after a delay
        setTimeout(() => showInstallBanner('ios'), 3000);
      }
      
      // Listen for successful install
      window.addEventListener('appinstalled', () => {
        isAppInstalled = true;
        deferredInstallPrompt = null;
        hideInstallBanner();
        console.log('[PWA] App installed successfully');
      });
    }
    
    function showInstallBanner(platform) {
      // Don't show if already dismissed this session
      if (localStorage.getItem('arc-install-dismissed')) return;
      
      const banner = document.getElementById('installBanner');
      const iosInstructions = document.getElementById('iosInstructions');
      const androidButton = document.getElementById('androidInstallBtn');
      
      if (banner) {
        if (platform === 'ios') {
          iosInstructions.style.display = 'block';
          androidButton.style.display = 'none';
        } else {
          iosInstructions.style.display = 'none';
          androidButton.style.display = 'flex';
        }
        banner.classList.add('visible');
      }
    }
    
    function hideInstallBanner() {
      const banner = document.getElementById('installBanner');
      if (banner) {
        banner.classList.remove('visible');
      }
    }
    
    function dismissInstallBanner() {
      hideInstallBanner();
      localStorage.setItem('arc-install-dismissed', 'true');
    }
    
    async function promptInstall() {
      if (!deferredInstallPrompt) return;
      
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      
      if (outcome === 'accepted') {
        console.log('[PWA] User accepted install prompt');
      } else {
        console.log('[PWA] User dismissed install prompt');
      }
      
      deferredInstallPrompt = null;
      hideInstallBanner();
    }
    
    // ===== PWA: OFFLINE DETECTION =====
    let isOnline = navigator.onLine;
    
    function updateOnlineStatus() {
      const wasOnline = isOnline;
      isOnline = navigator.onLine;
      
      const banner = document.getElementById('offlineBanner');
      if (banner) {
        if (!isOnline) {
          banner.classList.add('visible');
        } else {
          banner.classList.remove('visible');
          // Show brief "back online" message
          if (!wasOnline) {
            banner.textContent = '✓ Back online';
            banner.classList.add('visible', 'online');
            setTimeout(() => {
              banner.classList.remove('visible', 'online');
              banner.textContent = 'You\'re offline — cached content only';
            }, 2000);
          }
        }
      }
    }
    
    function setupOfflineDetection() {
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      // Initial check
      updateOnlineStatus();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      getSessionId();
      
      // Render welcome panel (single source of truth)
      const chatArea = document.getElementById('chatArea');
      if (chatArea) {
        chatArea.innerHTML = generateWelcomePanel();
      }
      
      // Focus input
      const messageInput = document.getElementById('messageInput');
      if (messageInput) {
        messageInput.focus();
      }
      
      // PWA initialization
      registerServiceWorker();
      setupInstallPrompt();
      setupOfflineDetection();
    });
  </script>

  <!-- Source Text Modal -->
  <div class="source-modal-overlay" id="sourceModal" onclick="if(event.target === this) closeSourceModal()">
    <div class="source-modal">
      <div class="source-modal-header">
        <div class="source-modal-title" id="sourceModalTitle"></div>
        <button class="source-modal-close" onclick="closeSourceModal()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="source-modal-body" id="sourceModalBody"></div>
    </div>
  </div>

  <!-- Hidden audio element for voice playback -->
  <audio id="voiceAudio" style="display: none;"></audio>
